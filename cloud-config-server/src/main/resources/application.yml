 # https://github.com/Nagarjun5005/microservices-config
spring:
  application:
    name: configserver
  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/Nagarjun5005/microservices-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
    bus:
      enabled: true
    stream:
      default-binder: rabbit
      # THIS IS THE KEY - Use a named queue group, not anonymous
      bindings:
        springCloudBusOutput:
          destination: springCloudBus
          group: ${spring.application.name}

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enables: true
  endpoint:
    health:
      probes:
        enabled: true