server:
  port: 9000
spring:
  application:
    name : "cards"
  profiles:
    active: prod
  config:
    import: "optional:configserver:http://localhost:8071/"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    bus:
      enabled: true
    stream:
      default-binder: rabbit
      # THIS IS THE KEY - Use a named queue group, not anonymous
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}


build:
  version:
    "4.0"



management:
  endpoints:
    web:
      exposure:
        include: "*"

cardS:
  message: "This Info Is From Cards --->Default  "
