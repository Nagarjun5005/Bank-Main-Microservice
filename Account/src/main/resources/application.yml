server:
  port: 8080

spring:
  application:
    name: accounts
  profiles:
    active: prod
  config:
    import: optional:configserver:http://localhost:8071/

  datasource:
    url: jdbc:mysql://localhost:3307/accountsdb
    username: root
    password: root

  jpa:
    show-sql: true
  sql:
    init:
      mode: always

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    bus:
      enabled: true
    stream:
      default-binder: rabbit
      # THIS IS THE KEY - Use a named queue group, not anonymous
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: '*'


-build :
  -  version:
  -    "1.0"

accounts:
  message: Welcome to NagsBank accounts related local APIs
  contactDetails:
    name: Nagarjun - Developer
    email: Nagarjun@gmail.com
  onCallSupport:
    - (555) 555-1234
    - (555) 523-1345
