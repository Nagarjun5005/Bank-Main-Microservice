server:
  port: 8090
spring:
  application:
    name: "loans"
  profiles:
    active: prod
  config:
    import: "optional:configserver:http://localhost:8071/"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    bus:
      enabled: true
    stream:
      default-binder: rabbit
      # THIS IS THE KEY - Use a named queue group, not anonymous
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version:
    "7.1"



